name: Release

# Pushing a tag like v2.1.0 is the only "publish" step this repo has — Claude
# Code, Gemini CLI, and OpenAI Codex CLI all install directly from this GitHub
# repo (no npm/pip-style registry), so a merge to main is already live for
# anyone tracking the default branch. This workflow just turns a version tag
# into a GitHub Release with auto-generated notes, so there's something for
# users who pin to a specific ref (--ref / @<tag>) to point at, and a
# changelog trail. See RUNBOOK.md for the full release checklist.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --generate-notes
